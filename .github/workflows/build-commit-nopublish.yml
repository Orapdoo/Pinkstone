# Used when a commit is pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
name: build-commit-nopublish

on:
  push:
    branches-ignore:
      - dev
    tags-ignore:
      - '*'

permissions:
  contents: write

concurrency:
  group: commit-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract current branch name
        shell: bash
        # bash pattern expansion to grab branch name without slashes
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> $GITHUB_OUTPUT
        id: ref

      - name: Extract commit metadata
        id: meta
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "release_time=$(date -u +"%Y-%m-%d %H:%M UTC")" >> "$GITHUB_OUTPUT"

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Execute Gradle build
        run: ./gradlew :fabric:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pinkstone-artifacts-${{ steps.ref.outputs.branch }}
          path: build/mods/*fabric*.jar

      - name: Publish Fabric commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-fabric-${{ github.sha }}
          name: Pinkstone Fabric CI ${{ steps.meta.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## Pinkstone Fabric Commit Build

            - Branch: `${{ steps.ref.outputs.branch }}`
            - Commit: `${{ github.sha }}`
            - Built at: `${{ steps.meta.outputs.release_time }}`

            This release is generated automatically from CI and includes ready-to-use Fabric jar artifacts.
          files: |
            build/mods/*fabric*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

