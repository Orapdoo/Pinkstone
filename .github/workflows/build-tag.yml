# Used when a commit is tagged and pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
name: build-tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !endsWith(github.ref_name, '-fabric') && !endsWith(github.ref_name, '-neoforge') }}
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Extract tag metadata
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "release_time=$(date -u +"%Y-%m-%d %H:%M UTC")" >> "$GITHUB_OUTPUT"
        id: meta
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Execute Gradle build
        run: ./gradlew build -Pbuild.release=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pinkstone-artifacts-${{ steps.meta.outputs.tag }}
          path: build/mods/*.jar

      - name: Create Fabric GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}-fabric
          name: Pinkstone Fabric ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/mods/*fabric*.jar
          fail_on_unmatched_files: true
          make_latest: false
          generate_release_notes: true
          append_body: true
          body: |
            ## Pinkstone Fabric Tagged Build

            - Source tag: `${{ steps.meta.outputs.tag }}`
            - Release tag: `${{ steps.meta.outputs.tag }}-fabric`
            - Commit: `${{ github.sha }}`
            - Built at: `${{ steps.meta.outputs.release_time }}`
            
            Includes only Fabric artifacts from CI.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create NeoForge GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}-neoforge
          name: Pinkstone NeoForge ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/mods/*neoforge*.jar
          fail_on_unmatched_files: true
          make_latest: false
          generate_release_notes: true
          append_body: true
          body: |
            ## Pinkstone NeoForge Tagged Build

            - Source tag: `${{ steps.meta.outputs.tag }}`
            - Release tag: `${{ steps.meta.outputs.tag }}-neoforge`
            - Commit: `${{ github.sha }}`
            - Built at: `${{ steps.meta.outputs.release_time }}`
            
            Includes only NeoForge artifacts from CI.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Tag Release to CaffeineMC Maven
        env:
          ORG_GRADLE_PROJECT_caffeineMCMavenUsername: ${{ secrets.CAFFEINEMC_MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_caffeineMCMavenPassword: ${{ secrets.CAFFEINEMC_MAVEN_PASSWORD }}
        if: ${{ env.ORG_GRADLE_PROJECT_caffeineMCMavenUsername != '' && env.ORG_GRADLE_PROJECT_caffeineMCMavenPassword != '' }}
        run: ./gradlew publishAllPublicationsToCaffeineMCRepository -Pbuild.release=true
